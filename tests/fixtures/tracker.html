<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tracker Enhancements browser fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 14px sans-serif; padding: 30px; --sidebar-item-height: 48px; --element-spacing: 6px; --element-spacing-half: 3px; --input-height: 26px; --color-text-primary: #ececec; background: #202127; color: var(--color-text-primary); }
    body.theme-light { --color-text-primary: #252525; background: #eeeeea; }
    .combat-sidebar { width: 320px; border: 1px solid #777; }
    .combat-tracker { list-style: none; padding: 0; margin: 0; }
    .combatant { display: flex; align-items: center; gap: 6px; padding: 6px; }
    .token-image { width: 48px; height: 48px; flex: 0 0 48px; }
    .token-name { flex: 1; }
    .name { margin: 0 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .combatant-controls { display: flex; align-items: center; gap: 3px; }
    .token-initiative { flex: 0 0 32px; }
    .token-initiative input { width: 32px; }
    .inline-control { font-size: 12px; width: 14px; padding: 0; }
    input { border: 1px solid #888; border-radius: 3px; color: inherit; background: #7772; }
  </style>
  <link rel="stylesheet" href="/styles/dist/tracker-enhancements.css">
</head>
<body class="theme-dark">
  <h2>Tracker fixture</h2>
  <section class="combat-sidebar"><ol class="combat-tracker"></ol></section>
  <script type="module" src="./tracker.mjs"></script>
</body>
</html>
