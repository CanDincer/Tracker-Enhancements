name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test release packaging
        run: python3 -m unittest discover -s tests -p 'test_release_*.py' -v
      - name: Verify an installable release archive
        env:
          PACKAGE_REPOSITORY: ${{ github.repository }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./module.json').version")"
          python3 scripts/package-release.py --tag "v$PACKAGE_VERSION" --repository "$PACKAGE_REPOSITORY"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Check generated files are current
        run: git diff --exit-code -- module.json lang styles/dist
      - name: Upload installable module for testing
        uses: actions/upload-artifact@v4
        with:
          name: tracker-enhancements-test
          path: |
            module.json
            module/
            lang/
            styles/dist/
          if-no-files-found: error
